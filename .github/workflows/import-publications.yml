# Convert Bibtex publications to Markdown-based webpages
name: Import Publications From Bibtex

permissions:
  contents: write

# Run workflow when a `.bib` file is added or updated
on:
  push:
    branches:
      - main
    paths: ['publications.bib']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  import-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import BibTeX publications
        run: python scripts/import_publications.py publications.bib content/publications/
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/publications
          if ! git diff --staged --quiet; then
            git commit -m "content: import publications from Bibtex"
            git push origin HEAD:${GITHUB_REF}
          else
            echo "No changes to commit"
          fi
