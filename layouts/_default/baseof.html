<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="{{ if .IsHome }}home{{ else }}section-{{ .Section }}{{ end }}">
    {{ partial "header.html" . }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    <script>
      (function () {
        document.querySelectorAll("[data-slider]").forEach((slider) => {
          const slides = Array.from(slider.querySelectorAll("[data-slide]"));
          if (slides.length < 2) return;
          let index = 0;
          const show = (next) => {
            index = (next + slides.length) % slides.length;
            slides.forEach((slide, i) => slide.toggleAttribute("data-active", i === index));
          };
          slider.querySelectorAll("[data-slider-next]").forEach((button) => button.addEventListener("click", () => show(index + 1)));
          slider.querySelectorAll("[data-slider-prev]").forEach((button) => button.addEventListener("click", () => show(index - 1)));
          show(0);
          window.setInterval(() => show(index + 1), Number(slider.dataset.interval || 7500));
        });
      })();
    </script>
  </body>
</html>
